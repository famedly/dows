[package]
name = "dows"
version = "0.1.0"
edition = "2024"
license = "AGPL-3.0-or-later"
repository = "https://github.com/famedly/dows"

[dependencies]
base64ct = { version = "1.8.0", features = ["alloc"] }
httparse = "1.10.1"
percent-encoding = "2.3.2"
sha1 = "0.11.0"
tokio = { version = "1.53.0", features = ["rt-multi-thread", "macros", "net", "io-util", "sync", "signal"] }

[dev-dependencies]
futures-util = "0.3"
nix = { version = "0.30", features = ["signal"] }
tokio-tungstenite = "0.26"
