allowMissingFormatter = false
excludes = [
    "*.lock",
    "*.patch",
    "package-lock.json",
    "go.mod",
    "go.sum",
    ".gitattributes",
    ".gitignore",
    ".gitmodules",
    ".hgignore",
    ".svnignore",
    "LICENSE",
    ".pre-commit-config.yaml",
    ".github/workflows/build.yml",
    ".github/workflows/check-pre-commit-hooks.yml",
    ".github/workflows/tests.yml",
    ".gitattributes",
    "treefmt.toml",
    "rustfmt.toml",
]
walk = "git"

[formatter.mdformat]
command = "mdformat"
excludes = []
includes = ["*.md"]
options = ["--wrap", "80"]

[formatter.nixfmt]
command = "nixfmt"
excludes = []
includes = ["*.nix"]
options = ["--strict"]

[formatter.rustfmt]
command = "rustfmt"
excludes = []
includes = ["*.rs"]
options = ["--config", "skip_children=true", "--edition", "2024"]
